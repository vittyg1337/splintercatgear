name: SEO QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate SEO, links, schema, and sitemap parity
        run: node scripts/seo-audit.mjs

      - name: Validate Amazon link compliance
        run: node scripts/check-amazon-links.mjs

      - name: Validate HTML
        run: npx --yes html-validate@11.10.0 "**/*.html"
